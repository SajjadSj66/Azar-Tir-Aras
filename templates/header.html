{% load static %} {% load i18n %}
<link rel="stylesheet" href="{% static 'css/style.css' %}" />

<!-- ============================================================ -->
<!--  2)  استایل اختصاصی سوییچر زبان (می‌توانید داخل style.css    -->
<!--      یا همینجا در <style> قرار دهید)                         -->
<!-- ============================================================ -->
<style>
  /* ===== نوار بالایی (Top Bar) ===== */
  .top-bar {
    background-color: #157a6e; /* رنگ پس‌زمینه‌ی دلخواه */
    padding: 8px 0;
    color: #ffffff;
    font-size: 0.9rem;
    width: 100%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }

  /* کانتینر اصلی نوار */
  .top-bar .container {
    display: flex;
    justify-content: space-between; /* تلفن چپ، بقیه راست */
    align-items: center; /* عمودی وسط‌چین */
    flex-wrap: wrap; /* برای موبایل به‌هم نریزد */
    gap: 10px;
  }

  /* ===== ریسپانسیو موبایل ===== */
  @media (max-width: 600px) {
    .top-bar .container {
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .top-right-group {
      justify-content: center;
      gap: 12px;
    }
  }
</style>

{% include 'top_bar.html' %}
